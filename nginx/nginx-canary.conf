# 金丝雀发布示例：按权重把请求分给稳定版和金丝雀版。
# 默认 9:1，约 10% 的请求到达新版本；调整 weight 后执行 nginx -t 和 nginx -s reload 生效。
upstream hw11_backend {
    # 共享内存区：多个 worker 共用同一份轮询状态，权重比例才能按全局请求数体现。
    zone hw11_backend 64k;
    server hw11-stable:5000 weight=9;
    server hw11-canary:5000 weight=1;
}

server {
    listen 80;

    location / {
        proxy_pass http://hw11_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
